name: Publish phase two visual concepts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-phase-two-artwork.yml'
permissions:
  contents: write
jobs:
  artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download reviewed Phase 2 JPGs
        run: |
          mkdir -p email-previews/phase-two
          curl --fail --location --retry 3 --silent --show-error 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-b9f0-81f6-8d0c-33b04e2132b5/raw?se=2026-11-18T00%3A52%3A39Z&sp=r&sv=2026-06-06&sr=b&scid=68232e60-6cae-55c8-bb82-f5c78b7d1e70&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-17T22%3A29%3A53Z&ske=2026-11-18T22%3A29%3A53Z&sks=b&skv=2026-06-06&sig=Jup2z8YUu2L9nLzkOESulhcqBbHJgPrd2SE3sxPcj4E%3D' -o 'email-previews/phase-two/harmony-patient-journey.jpg'
          file 'email-previews/phase-two/harmony-patient-journey.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-e930-81f6-8019-cf8e266dc15c/raw?se=2026-11-18T00%3A52%3A40Z&sp=r&sv=2026-06-06&sr=b&scid=f2978772-ea9a-5fe4-b9c1-37d2245d8de7&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-17T22%3A37%3A59Z&ske=2026-11-18T22%3A37%3A59Z&sks=b&skv=2026-06-06&sig=nkmVDr3kZgRVYAAKunZviUa8V3XKoVOnOCBvVPDSBWk%3D' -o 'email-previews/phase-two/northgate-concept.jpg'
          file 'email-previews/phase-two/northgate-concept.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-1390-81f6-8b1d-f14d788a13d5/raw?se=2026-11-18T00%3A52%3A40Z&sp=r&sv=2026-06-06&sr=b&scid=eb4c991f-ffb8-5786-a20e-128166c61057&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-17T22%3A34%3A51Z&ske=2026-11-18T22%3A34%3A51Z&sks=b&skv=2026-06-06&sig=nICnFahKfrmdKLNDarXxgzVNuLvAzwPHJe7KZ1/bHr4%3D' -o 'email-previews/phase-two/rock-creek-concept.jpg'
          file 'email-previews/phase-two/rock-creek-concept.jpg'
      - name: Commit only image files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add email-previews/phase-two/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Phase 2 prospect concept images'
            git push
          fi
