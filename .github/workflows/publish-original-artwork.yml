name: Publish original website concept screenshots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-original-artwork.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the exact approved mockup images
        run: |
          mkdir -p email-previews
          curl --fail --location --retry 3 --silent --show-error 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-cb5c-81f6-af55-37cddd659c68/raw?se=2026-11-15T22%3A52%3A13Z&sp=r&sv=2026-06-06&sr=b&scid=56b5312f-2abd-598c-a3e7-fbb7c4670cfc&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-15T10%3A24%3A29Z&ske=2026-11-16T10%3A24%3A29Z&sks=b&skv=2026-06-06&sig=M518/dyBWg9nJBhtEDan27I8PaJDhUsdqrJESOt2ntk%3D' -o "email-previews/original-les-delices.jpg"
          file "email-previews/original-les-delices.jpg"
          curl --fail --location --retry 3 --silent --show-error 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-5adc-81f6-9cfa-d637c5805379/raw?se=2026-11-15T22%3A52%3A13Z&sp=r&sv=2026-06-06&sr=b&scid=ff7a5ead-867c-5746-a666-2cc5abf6306d&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-15T10%3A13%3A15Z&ske=2026-11-16T10%3A13%3A15Z&sks=b&skv=2026-06-06&sig=tKPuW5L2rxkpMoXCuIMv0WfP9OyQirzOC%2BGPIRb45fg%3D' -o "email-previews/original-total-rc.jpg"
          file "email-previews/original-total-rc.jpg"
          curl --fail --location --retry 3 --silent --show-error 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-d43c-81f6-9e99-38fbd24d94e4/raw?se=2026-11-15T22%3A52%3A14Z&sp=r&sv=2026-06-06&sr=b&scid=3a992960-f473-5978-a50c-0f3edde1e3c4&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-15T15%3A51%3A05Z&ske=2026-11-16T15%3A51%3A05Z&sks=b&skv=2026-06-06&sig=CA3nJ7bbsi0mo9WdFbhQ5b6n6RKgqyZOq6fzgwJsdcQ%3D' -o "email-previews/original-a-and-j.jpg"
          file "email-previews/original-a-and-j.jpg"
          curl --fail --location --retry 3 --silent --show-error 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-99cc-81f6-b0e9-c91dad80aa7e/raw?se=2026-11-15T22%3A52%3A15Z&sp=r&sv=2026-06-06&sr=b&scid=7611b6da-1855-5d23-8ce1-da3339c4cda3&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-15T15%3A58%3A48Z&ske=2026-11-16T15%3A58%3A48Z&sks=b&skv=2026-06-06&sig=7oDTAh9ayPCHT0Kzi6fWFKX12gO%2BFhEYPGWYhv6LEqo%3D' -o "email-previews/original-real-estate.jpg"
          file "email-previews/original-real-estate.jpg"
      - name: Commit original designs as email images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add email-previews/original-*.jpg
          git commit -m 'Publish original visual pitch mockups for embedded emails'
          git push
