name: Publish Momentum email concept image
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-momentum-concept.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve artwork
        run: |
          mkdir -p email-previews/phase-two
          curl --fail --location --retry 3 --silent --show-error 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-1200-81f6-ab7a-4f0a15b83516/raw?se=2026-11-18T03%3A08%3A09Z&sp=r&sv=2026-06-06&sr=b&scid=9296c16c-14cc-5e14-b46b-1ab422ccc791&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T02%3A44%3A57Z&ske=2026-11-19T02%3A44%3A57Z&sks=b&skv=2026-06-06&sig=6I2kCLNb0DhVdzO9nohqf8TwHR5VSKG%2BfMpvjL7OU%2B8%3D' -o 'email-previews/phase-two/momentum-law-inquiry.jpg'
          file 'email-previews/phase-two/momentum-law-inquiry.jpg'
      - name: Commit image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'email-previews/phase-two/momentum-law-inquiry.jpg'
          git commit -m 'Publish Momentum Law inquiry concept'
          git push
